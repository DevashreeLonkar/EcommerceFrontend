<div class=" container mt-5">
  <div align="right" class="mb-5">
    <button (click)="checkout()" mat-raised-button color="primary" 
    [disabled]="cartDetails.length === 0"
    matTooltip="Add items to cart before checkout"
    >Checkout</button>
  </div>
<table mat-table [dataSource]="cartDetails" class="mat-elevation-z8">

 <ng-container matColumnDef="Name">
  <th mat-header-cell *matHeaderCellDef> Name </th>
  <td mat-cell *matCellDef="let element"> {{element.productName}} </td>
</ng-container>

<ng-container matColumnDef="Description">
  <th mat-header-cell *matHeaderCellDef> Description </th>
  <td mat-cell *matCellDef="let element"> {{element.productDescription}} </td>
</ng-container>

<ng-container matColumnDef="Price">
  <th mat-header-cell *matHeaderCellDef> Price </th>
  <td mat-cell *matCellDef="let element"> {{element.productActualPrice}} </td>
</ng-container>

<ng-container matColumnDef="Discounted Price">
  <th mat-header-cell *matHeaderCellDef> Discounted Price </th>
  <td mat-cell *matCellDef="let element"> {{element.productDiscountedPrice}} </td>
</ng-container>

<ng-container matColumnDef="Action">
  <th mat-header-cell *matHeaderCellDef> Action </th>
  <td mat-cell *matCellDef="let element"> 
    <button mat-raised-button color="warn" (click)="delete(element.productId)">Delete</button>  
  </td>
</ng-container>

   <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
</div>
